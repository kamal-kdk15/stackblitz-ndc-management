# .github/workflows/daily-devlog.yml
# Auto-commits to DEVLOG.md multiple times a day at fixed IST times.
# Put this file at: <your-repo>/.github/workflows/daily-devlog.yml

name: Daily Devlog Commit

on:
  schedule:
    # Times are in UTC. IST = UTC+5:30, so these hit roughly
    # 8am, 9:30am, 11am, 12:30pm, 2pm, 3:30pm, 5pm, 6:30pm,
    # 8pm, 9:30pm, 11pm, 12:30am IST (12 runs/day)
    - cron: '30 2 * * *'
    - cron: '0 4 * * *'
    - cron: '30 5 * * *'
    - cron: '0 7 * * *'
    - cron: '30 8 * * *'
    - cron: '0 10 * * *'
    - cron: '30 11 * * *'
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'
    - cron: '0 16 * * *'
    - cron: '30 17 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch: {} # lets you trigger manually from the Actions tab too

permissions:
  contents: write

jobs:
  update-devlog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Append entry to DEVLOG.md
        run: |
          echo "" >> DEVLOG.md
          echo "### $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')" >> DEVLOG.md
          echo "- Auto-logged checkpoint. Add real notes here manually when you touch the code." >> DEVLOG.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEVLOG.md
          git commit -m "docs: devlog update $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')" || echo "Nothing to commit"
          git push